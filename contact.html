<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon"></div>
      <span>COMPANY NAME</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="about.html">ABOUT US</a></li>
      <li><a href="portfolio.html">PORTFOLIO</a></li>
      <li><a href="contact.html" class="active">CONTACT US</a></li>
      <li><a href="contact.html" class="btn-get-started">GET STARTED</a></li>
    </ul>
  </header>

  <main>
    <div class="section-container">
      <h2 class="section-title">CONTACT US</h2>
      <div class="underline-accent"></div>

      <div class="contact-wrapper">
        <form class="contact-form" id="contactForm">
          <input type="text" placeholder="ชื่อของคุณ (Name)" required>
          <input type="email" placeholder="อีเมล (Email)" required>
          <textarea placeholder="ข้อความของคุณ (Message)" required></textarea>
          <button type="submit">SEND MESSAGE</button>
        </form>

        <div class="contact-details">
          <div class="contact-card">
            <i class="fa-solid fa-envelope"></i>
            <div>
              <h4>Email</h4>
              <p class="text-sub">yourname@email.com</p>
            </div>
          </div>

          <div class="contact-card">
            <i class="fa-solid fa-phone"></i>
            <div>
              <h4>Phone</h4>
              <p class="text-sub">+66 81 234 5678</p>
            </div>
          </div>

          <div class="contact-card">
            <i class="fa-solid fa-location-dot"></i>
            <div>
              <h4>Location</h4>
              <p class="text-sub">Bangkok, Thailand</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
